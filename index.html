<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. الهيدر (الشريط العلوي) -->
    <header>
        <nav class="navbar">
            <span class="logo">Zainab ali</span> <!-- zainab ali-->
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <!-- 2. المحتوى الأساسي -->
    <main>
        <!-- العنوان الرئيسي -->
        <h1>Zainab ali</h1> <!-- zainab ali -->

        <!-- الصورة -->
        <img src="images/me.jpg" alt="My Profile Photo" class="profile-pic">

        <!-- 3. الكروت الثلاثة -->
        <div class="cards-container">
            <div class="card">
                <h3>Skills</h3>
                <p>HTML, CSS, JavaScript</p>
            </div>
            <div class="card">
                <h3>Hobbies</h3>
                <p>Reading, Coding, Design</p>
            </div>
            <div class="card">
                <h3>Goals</h3>
                <p>Become a Web Developer</p>
            </div>
        </div>

        <!-- 4. الفورم -->
        <form class="contact-form">
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name">
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email">
            </div>
            <button type="submit" class="submit-btn">Send</button>
        </form>

        <!-- 5. زرار الوضع الليلي -->
        <button id="theme-toggle" class="theme-btn">Toggle Dark Mode</button>
    </main>

    <!-- 6. الفوتر -->
    <footer>
        <p>&copy; 2026 zainab ali. All rights reserved.</p>
    </footer>

    <!-- ربط ملف الـ JS (لازم يكون آخر حاجة) -->
    <script src="js/script.js"></script>
</body>
</html>z
